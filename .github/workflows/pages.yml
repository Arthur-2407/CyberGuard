name: Deploy CyberGuard Frontend to GitHub Pages

on:
  workflow_run:
    workflows: ["CyberGuard Enterprise CI Pipeline"]
    branches: [ main ]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Verify Frontend Static Assets
        run: |
          test -f ./frontend/index.html
          test -f ./frontend/app.js
          test -f ./frontend/styles.css
          test -f ./frontend/config.js

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Frontend Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
