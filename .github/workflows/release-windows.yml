name: CyberGuard Windows Desktop Dual Edition Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-distributions:
    name: Build & Package Standard Installer & Portable Edition
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "desktop/package-lock.json"

      - name: Install Desktop Build Dependencies
        working-directory: desktop
        run: |
          npm ci || npm install

      - name: Build & Package Standard Installer and Portable Edition
        working-directory: desktop
        run: |
          npm run dist

      - name: Verify Installer Artifacts
        shell: pwsh
        run: |
          $installerPath = "dist/windows/CyberGuard-Setup.exe"
          $portablePath = "dist/windows/CyberGuard-Portable.exe"

          if (-not (Test-Path $installerPath)) {
            Write-Error "Installer artifact was not generated at: $installerPath"
            exit 1
          }
          if (-not (Test-Path $portablePath)) {
            Write-Error "Portable artifact was not generated at: $portablePath"
            exit 1
          }

          $installerHash = Get-FileHash -Algorithm SHA256 $installerPath
          $installerSize = (Get-Item $installerPath).Length / 1MB
          Write-Host "✓ Verified Windows NSIS Installer: $installerPath"
          Write-Host "  Size: $([math]::Round($installerSize, 2)) MB"
          Write-Host "  SHA-256: $($installerHash.Hash)"

          $portableHash = Get-FileHash -Algorithm SHA256 $portablePath
          $portableSize = (Get-Item $portablePath).Length / 1MB
          Write-Host "✓ Verified Windows Portable Edition: $portablePath"
          Write-Host "  Size: $([math]::Round($portableSize, 2)) MB"
          Write-Host "  SHA-256: $($portableHash.Hash)"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberGuard-Setup-Windows-x64
          path: dist/windows/CyberGuard-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberGuard-Portable-Windows-x64
          path: dist/windows/CyberGuard-Portable.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/CyberGuard-Setup.exe
            dist/windows/CyberGuard-Portable.exe
          generate_release_notes: true
