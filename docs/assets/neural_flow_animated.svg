<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="nfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814" />
      <stop offset="50%" stop-color="#081226" />
      <stop offset="100%" stop-color="#030611" />
    </linearGradient>

    <linearGradient id="beamCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="beamPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <filter id="nfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, sans-serif; }
    
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 4px #00f0ff); }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #00f0ff); }
    }
    @keyframes particleMove {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barPulse {
      0%, 100% { height: 10px; y: -5px; }
      50% { height: 38px; y: -19px; }
    }
    @keyframes needleSwing {
      0%, 100% { transform: rotate(15deg); }
      50% { transform: rotate(72deg); }
    }
    .flow-dash {
      stroke-dasharray: 8 6;
      animation: particleMove 1.5s linear infinite;
    }
    .needle-anim {
      transform-origin: 860px 145px;
      animation: needleSwing 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Card -->
  <rect width="960" height="260" rx="12" fill="url(#nfBg)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" />

  <!-- Corner Brackets -->
  <path d="M 15 35 L 15 15 L 35 15" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 945 35 L 945 15 L 925 15" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 15 225 L 15 245 L 35 245" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 945 225 L 945 245 L 925 245" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Title Strip -->
  <text x="35" y="38" fill="#00f0ff" font-size="12" font-weight="700" letter-spacing="2" class="mono">STAGE 1: ACOUSTIC INGESTION</text>
  <text x="375" y="38" fill="#a855f7" font-size="12" font-weight="700" letter-spacing="2" class="mono">STAGE 2: DUAL CNN-BiLSTM CORE</text>
  <text x="735" y="38" fill="#ff0055" font-size="12" font-weight="700" letter-spacing="2" class="mono">STAGE 3: RISK ENGINE</text>

  <!-- ── STAGE 1: Audio Ingestion Module ──────────────────────── -->
  <g transform="translate(40, 60)">
    <rect width="240" height="165" rx="8" fill="#081020" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <text x="18" y="30" fill="#ffffff" font-size="13" font-weight="700" class="sans">16.0 kHz Audio Buffer</text>
    <text x="18" y="48" fill="#64748b" font-size="10" class="mono">WebRTC VAD Silence Stripping</text>

    <!-- Animated Waveform Bars -->
    <g transform="translate(25, 105)">
      <rect x="0" y="-8" width="5" height="16" rx="2" fill="#00f0ff">
        <animate attributeName="height" values="8;28;12;24;8" dur="1s" repeatCount="indefinite" />
        <animate attributeName="y" values="-4;-14;-6;-12;-4" dur="1s" repeatCount="indefinite" />
      </rect>
      <rect x="9" y="-14" width="5" height="28" rx="2" fill="#00f0ff">
        <animate attributeName="height" values="14;38;18;32;14" dur="0.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="-7;-19;-9;-16;-7" dur="0.8s" repeatCount="indefinite" />
      </rect>
      <rect x="18" y="-6" width="5" height="12" rx="2" fill="#38bdf8">
        <animate attributeName="height" values="6;22;10;18;6" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="-3;-11;-5;-9;-3" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="27" y="-18" width="5" height="36" rx="2" fill="#38bdf8">
        <animate attributeName="height" values="12;42;16;30;12" dur="0.9s" repeatCount="indefinite" />
        <animate attributeName="y" values="-6;-21;-8;-15;-6" dur="0.9s" repeatCount="indefinite" />
      </rect>
      <rect x="36" y="-10" width="5" height="20" rx="2" fill="#818cf8">
        <animate attributeName="height" values="10;26;12;20;10" dur="1.1s" repeatCount="indefinite" />
        <animate attributeName="y" values="-5;-13;-6;-10;-5" dur="1.1s" repeatCount="indefinite" />
      </rect>
      <rect x="45" y="-22" width="5" height="44" rx="2" fill="#818cf8">
        <animate attributeName="height" values="16;44;20;36;16" dur="0.75s" repeatCount="indefinite" />
        <animate attributeName="y" values="-8;-22;-10;-18;-8" dur="0.75s" repeatCount="indefinite" />
      </rect>
      <rect x="54" y="-8" width="5" height="16" rx="2" fill="#a855f7">
        <animate attributeName="height" values="8;24;10;18;8" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="-4;-12;-5;-9;-4" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="63" y="-16" width="5" height="32" rx="2" fill="#a855f7">
        <animate attributeName="height" values="14;34;16;28;14" dur="0.85s" repeatCount="indefinite" />
        <animate attributeName="y" values="-7;-17;-8;-14;-7" dur="0.85s" repeatCount="indefinite" />
      </rect>
      <rect x="72" y="-12" width="5" height="24" rx="2" fill="#c084fc">
        <animate attributeName="height" values="10;30;14;22;10" dur="1.05s" repeatCount="indefinite" />
        <animate attributeName="y" values="-5;-15;-7;-11;-5" dur="1.05s" repeatCount="indefinite" />
      </rect>
      <rect x="81" y="-20" width="5" height="40" rx="2" fill="#c084fc">
        <animate attributeName="height" values="18;42;22;34;18" dur="0.8s" repeatCount="indefinite" />
        <animate attributeName="y" values="-9;-21;-11;-17;-9" dur="0.8s" repeatCount="indefinite" />
      </rect>
    </g>

    <text x="18" y="145" fill="#00ff88" font-size="10" font-weight="600" class="mono">STATUS: 2.0s SLIDING WINDOW</text>
  </g>

  <!-- Flow Connector 1 -> 2 with Animated Traveling Beams -->
  <line x1="280" y1="142" x2="365" y2="142" stroke="#00f0ff" stroke-width="2" class="flow-dash" />
  <polygon points="365,142 355,138 355,146" fill="#00f0ff" filter="url(#nfGlow)" />

  <!-- ── STAGE 2: Neural Model Core ────────────────────────────── -->
  <g transform="translate(365, 60)">
    <rect width="280" height="165" rx="8" fill="#0e0e24" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
    <text x="18" y="28" fill="#ffffff" font-size="13" font-weight="700" class="sans">EnsembleDetector (v008)</text>
    <text x="18" y="44" fill="#a855f7" font-size="10" class="mono">8.94M Weights • Dual BiLSTM + Gated Fusion</text>

    <!-- Neural Feature Node Badges -->
    <g transform="translate(18, 60)">
      <rect x="0" y="0" width="115" height="22" rx="4" fill="#181534" stroke="#00f0ff" stroke-width="0.7" />
      <text x="8" y="15" fill="#00f0ff" font-size="9" font-weight="600" class="mono">Wav2Vec2 (768-D)</text>

      <rect x="125" y="0" width="115" height="22" rx="4" fill="#181534" stroke="#a855f7" stroke-width="0.7" />
      <text x="133" y="15" fill="#c084fc" font-size="9" font-weight="600" class="mono">ECAPA (192-D)</text>

      <rect x="0" y="28" width="115" height="22" rx="4" fill="#181534" stroke="#38bdf8" stroke-width="0.7" />
      <text x="8" y="43" fill="#38bdf8" font-size="9" font-weight="600" class="mono">Log-Mel (80-Band)</text>

      <rect x="125" y="28" width="115" height="22" rx="4" fill="#181534" stroke="#ec4899" stroke-width="0.7" />
      <text x="133" y="43" fill="#f472b6" font-size="9" font-weight="600" class="mono">MFCC-120 + F0/HNR</text>
    </g>

    <text x="18" y="145" fill="#c084fc" font-size="10" font-weight="600" class="mono">RESIDUAL GATED MULTI-MODAL FUSION</text>
  </g>

  <!-- Flow Connector 2 -> 3 with Animated Traveling Beams -->
  <line x1="645" y1="142" x2="725" y2="142" stroke="#a855f7" stroke-width="2" class="flow-dash" />
  <polygon points="725,142 715,138 715,146" fill="#ff0055" filter="url(#nfGlow)" />

  <!-- ── STAGE 3: Risk Engine & Gauge ──────────────────────────── -->
  <g transform="translate(725, 60)">
    <rect width="195" height="165" rx="8" fill="#1c0715" stroke="#ff0055" stroke-width="1" stroke-opacity="0.5" />
    <text x="18" y="28" fill="#ffffff" font-size="13" font-weight="700" class="sans">Risk Scoring HUD</text>
    <text x="18" y="44" fill="#ff0055" font-size="10" class="mono">Temporal Peak / Mean Engine</text>

    <!-- Semi-Circular Gauge Arc -->
    <g transform="translate(98, 105)">
      <path d="M -55 0 A 55 55 0 0 1 55 0" fill="none" stroke="#2a1220" stroke-width="8" stroke-linecap="round" />
      <path d="M -55 0 A 55 55 0 0 1 20 -51" fill="none" stroke="url(#beamPurple)" stroke-width="8" stroke-linecap="round" filter="url(#nfGlow)" />

      <!-- Gauge Needle -->
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#ff0055" stroke-width="3" stroke-linecap="round" class="needle-anim" />
      <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <!-- Score & Alert Badge -->
    <rect x="25" y="128" width="145" height="24" rx="4" fill="#ff0055" fill-opacity="0.15" stroke="#ff0055" stroke-width="1" />
    <text x="35" y="144" fill="#ff0055" font-size="10" font-weight="700" letter-spacing="1" class="mono">PEAK RISK: 1.000 CRITICAL</text>
  </g>
</svg>
