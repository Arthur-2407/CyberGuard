<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="100%">
  <defs>
    <linearGradient id="tiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a18" />
      <stop offset="50%" stop-color="#0a1228" />
      <stop offset="100%" stop-color="#040714" />
    </linearGradient>

    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    <filter id="tiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, sans-serif; }

    @keyframes laserSweep {
      0%, 100% { y: 25px; opacity: 0.2; }
      50% { y: 110px; opacity: 0.9; }
    }
    @keyframes radarPulse {
      0% { r: 12px; opacity: 0.9; }
      100% { r: 35px; opacity: 0.0; }
    }
    @keyframes blinkLed {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
    .laser-line {
      animation: laserSweep 2.5s ease-in-out infinite;
    }
    .pulse-ring {
      animation: radarPulse 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    .pulse-ring-delayed {
      animation: radarPulse 2s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      animation-delay: 1s;
    }
    .led-blink {
      animation: blinkLed 1.5s step-end infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="260" rx="12" fill="url(#tiBg)" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" />

  <!-- Corner Tech Borders -->
  <path d="M 15 35 L 15 15 L 35 15" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 945 35 L 945 15 L 925 15" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 15 225 L 15 245 L 35 245" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 945 225 L 945 245 L 925 245" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Title Strip -->
  <text x="35" y="38" fill="#00f0ff" font-size="12" font-weight="700" letter-spacing="2" class="mono">FEED 1: EXTERNAL INTEL GRID</text>
  <text x="365" y="38" fill="#a855f7" font-size="12" font-weight="700" letter-spacing="2" class="mono">FEED 2: QR &amp; URL QUISHING SCAN</text>
  <text x="695" y="38" fill="#00ff88" font-size="12" font-weight="700" letter-spacing="2" class="mono">FEED 3: AI LLM SOC ANALYST</text>

  <!-- ── PANEL 1: Threat Feeds (VirusTotal & URLhaus) ────────────── -->
  <g transform="translate(35, 60)">
    <rect width="280" height="165" rx="8" fill="#0b1329" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <text x="18" y="28" fill="#ffffff" font-size="13" font-weight="700" class="sans">VirusTotal v3 &amp; URLhaus Feeds</text>
    <text x="18" y="44" fill="#64748b" font-size="10" class="mono">Cryptographic Hash &amp; Malware Sync</text>

    <!-- Radar Nodes with Pulsing Wave Rings -->
    <g transform="translate(70, 105)">
      <circle cx="0" cy="0" r="14" fill="#00f0ff" fill-opacity="0.2" stroke="#00f0ff" stroke-width="1.5" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00f0ff" stroke-width="1.5" class="pulse-ring" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#00f0ff" stroke-width="1.5" class="pulse-ring-delayed" />
      <circle cx="0" cy="0" r="4" fill="#00f0ff" />
      <text x="-35" y="30" fill="#00f0ff" font-size="9" font-weight="600" class="mono">VIRUSTOTAL v3</text>
    </g>

    <g transform="translate(200, 105)">
      <circle cx="0" cy="0" r="14" fill="#ff0055" fill-opacity="0.2" stroke="#ff0055" stroke-width="1.5" />
      <circle cx="0" cy="0" r="14" fill="none" stroke="#ff0055" stroke-width="1.5" class="pulse-ring" />
      <circle cx="0" cy="0" r="4" fill="#ff0055" />
      <text x="-30" y="30" fill="#ff0055" font-size="9" font-weight="600" class="mono">URLHAUS FEED</text>
    </g>

    <text x="18" y="152" fill="#00ff88" font-size="10" font-weight="600" class="mono">STATUS: 70+ ENGINES CORRELATED</text>
  </g>

  <!-- ── PANEL 2: QR Quishing Matrix with Animated Laser ────────── -->
  <g transform="translate(345, 60)">
    <rect width="280" height="165" rx="8" fill="#130e29" stroke="#a855f7" stroke-width="1" stroke-opacity="0.5" />
    <text x="18" y="28" fill="#ffffff" font-size="13" font-weight="700" class="sans">Computer Vision QR Decapsulator</text>
    <text x="18" y="44" fill="#a855f7" font-size="10" class="mono">Recursive Safe Redirect Traversal</text>

    <!-- Stylized QR Matrix Pattern -->
    <g transform="translate(30, 62)">
      <!-- QR Position Markers -->
      <rect x="0" y="0" width="28" height="28" rx="2" fill="none" stroke="#a855f7" stroke-width="2.5" />
      <rect x="7" y="7" width="14" height="14" fill="#a855f7" />

      <rect x="75" y="0" width="28" height="28" rx="2" fill="none" stroke="#a855f7" stroke-width="2.5" />
      <rect x="82" y="7" width="14" height="14" fill="#a855f7" />

      <rect x="0" y="42" width="28" height="28" rx="2" fill="none" stroke="#a855f7" stroke-width="2.5" />
      <rect x="7" y="49" width="14" height="14" fill="#a855f7" />

      <!-- QR Payload Data Bits -->
      <rect x="36" y="8" width="8" height="8" fill="#c084fc" />
      <rect x="52" y="16" width="8" height="8" fill="#c084fc" />
      <rect x="36" y="32" width="8" height="8" fill="#c084fc" />
      <rect x="48" y="48" width="8" height="8" fill="#c084fc" />
      <rect x="68" y="40" width="8" height="8" fill="#c084fc" />
      <rect x="85" y="52" width="8" height="8" fill="#c084fc" />

      <!-- Animated Scanning Laser Bar -->
      <line x1="-10" y1="0" x2="115" y2="0" stroke="#00f0ff" stroke-width="2.5" class="laser-line" filter="url(#tiGlow)" />
    </g>

    <!-- Scanner Telemetry -->
    <g transform="translate(155, 75)">
      <text x="0" y="12" fill="#94a3b8" font-size="10" class="mono">ENTROPY: 4.82</text>
      <text x="0" y="28" fill="#94a3b8" font-size="10" class="mono">PUNYCODE: NONE</text>
      <text x="0" y="44" fill="#ff0055" font-size="10" font-weight="700" class="mono">DEST: MALICIOUS</text>
    </g>

    <text x="18" y="152" fill="#c084fc" font-size="10" font-weight="600" class="mono">QUISHING THREAT NEUTRALIZED</text>
  </g>

  <!-- ── PANEL 3: Explainable AI LLM Analyst ─────────────────────── -->
  <g transform="translate(655, 60)">
    <rect width="270" height="165" rx="8" fill="#091b1a" stroke="#00ff88" stroke-width="1" stroke-opacity="0.4" />
    <text x="18" y="28" fill="#ffffff" font-size="13" font-weight="700" class="sans">Explainable AI SOC Analyst</text>
    <text x="18" y="44" fill="#00ff88" font-size="10" class="mono">MITRE ATT&amp;CK Technique Mapping</text>

    <!-- Threat Vector Tags -->
    <g transform="translate(18, 62)">
      <rect x="0" y="0" width="110" height="20" rx="3" fill="#132c28" stroke="#00ff88" stroke-width="0.7" />
      <text x="8" y="14" fill="#00ff88" font-size="9" font-weight="600" class="mono">T1566.002 LINK</text>

      <rect x="120" y="0" width="110" height="20" rx="3" fill="#132c28" stroke="#00ff88" stroke-width="0.7" />
      <text x="128" y="14" fill="#00ff88" font-size="9" font-weight="600" class="mono">T1566.003 VOICE</text>

      <rect x="0" y="26" width="110" height="20" rx="3" fill="#132c28" stroke="#00ff88" stroke-width="0.7" />
      <text x="8" y="40" fill="#00ff88" font-size="9" font-weight="600" class="mono">T1656 SPOOF</text>

      <rect x="120" y="26" width="110" height="20" rx="3" fill="#132c28" stroke="#00ff88" stroke-width="0.7" />
      <text x="128" y="40" fill="#00ff88" font-size="9" font-weight="600" class="mono">T1204.001 EXEC</text>
    </g>

    <!-- Active SOC Response Status -->
    <g transform="translate(18, 122)">
      <circle cx="5" cy="5" r="4" fill="#00ff88" class="led-blink" />
      <text x="16" y="9" fill="#00ff88" font-size="10" font-weight="700" class="mono">AUTOMATED PLAYBOOK: CONTAINED</text>
    </g>

    <text x="18" y="152" fill="#94a3b8" font-size="10" class="mono">EXECUTIVE BRIEFING GENERATED</text>
  </g>
</svg>
