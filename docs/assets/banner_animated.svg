<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Dark Cyber Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#060e24" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="gridGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.0" />
    </linearGradient>

    <!-- Scanline Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00f0ff" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="0" cy="0" r="1" fill="#00f0ff" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes scanlineAnim {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.4; }
      100% { transform: translateY(360px); opacity: 0.1; }
    }
    
    @keyframes wavePulse {
      0%, 100% { transform: scaleY(0.3); }
      50% { transform: scaleY(1.0); }
    }

    @keyframes radarSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes textGlow {
      0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 8px #00f0ff); }
      50% { opacity: 1.0; filter: drop-shadow(0 0 16px #00f0ff); }
    }

    @keyframes hudBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .radar-beam {
      transform-origin: 1050px 180px;
      animation: radarSpin 6s linear infinite;
    }

    .title-glow {
      animation: textGlow 4s ease-in-out infinite;
    }

    .hud-pulse {
      animation: hudBlink 2s step-end infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />
  <rect width="1200" height="360" fill="url(#cyberGrid)" />

  <!-- Cyberpunk Angular Corner Borders -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 1180 50 L 1180 20 L 1150 20" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 20 310 L 20 340 L 50 340" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M 1180 310 L 1180 340 L 1150 340" stroke="#00f0ff" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Animated Horizon / Scanline Beam -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#00f0ff" stroke-width="1.5" opacity="0.25">
    <animate attributeName="y1" values="20;340;20" dur="8s" repeatCount="indefinite" />
    <animate attributeName="y2" values="20;340;20" dur="8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1;0.45;0.1" dur="8s" repeatCount="indefinite" />
  </line>

  <!-- Left: Glowing Multi-Layered Cyber Shield Logo -->
  <g transform="translate(70, 75)">
    <!-- Outer Hex Shield Glow -->
    <polygon points="65,5 125,35 125,105 65,135 5,105 5,35" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.4" filter="url(#glow)">
      <animate attributeName="stroke-opacity" values="0.3;0.9;0.3" dur="3s" repeatCount="indefinite" />
    </polygon>

    <!-- Mid Shield -->
    <polygon points="65,15 115,40 115,100 65,125 15,100 15,40" fill="#001529" stroke="url(#neonCyan)" stroke-width="2" opacity="0.85" />

    <!-- Inner Core & Acoustic Pulse Rings -->
    <circle cx="65" cy="70" r="30" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0 65 70" to="360 65 70" dur="12s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="65" cy="70" r="18" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.9">
      <animate attributeName="r" values="14;22;14" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" />
    </circle>

    <!-- Center Neural Spark -->
    <polygon points="65,58 74,68 65,82 56,68" fill="#00f0ff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.7;1.0;0.7" dur="1.5s" repeatCount="indefinite" />
    </polygon>
  </g>

  <!-- Central Typography & Futuristic Brand -->
  <g transform="translate(240, 110)">
    <!-- Status Tag -->
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1" />
    <circle cx="12" cy="12" r="4" fill="#00ff88" class="hud-pulse" />
    <text x="24" y="16" fill="#00f0ff" font-size="11" font-weight="700" letter-spacing="2" class="mono">NEURAL DEFENSE MATRIX</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="4" class="sans title-glow">
      CYBER<tspan fill="#00f0ff">GUARD</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="104" fill="#94a3b8" font-size="14" font-weight="500" letter-spacing="1.5" class="sans">
      QUANTUM-GRADE MULTI-MODAL THREAT INTELLIGENCE &amp; NEURAL DEEPFAKE SHIELD
    </text>

    <!-- Telemetry Badges Strip -->
    <g transform="translate(2, 130)">
      <!-- Badge 1: 10 Operational Engines -->
      <rect x="0" y="0" width="165" height="26" rx="4" fill="#0b1329" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="12" y="17" fill="#00f0ff" font-size="11" font-weight="600" class="mono">◈ 10 DEFENSE ENGINES</text>

      <!-- Badge 2: Neural BiLSTM Active -->
      <rect x="175" y="0" width="165" height="26" rx="4" fill="#0b1329" stroke="#a855f7" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="187" y="17" fill="#c084fc" font-size="11" font-weight="600" class="mono">⚡ DUAL-CNN-BiLSTM v008</text>

      <!-- Badge 3: Android Edge Companion -->
      <rect x="350" y="0" width="170" height="26" rx="4" fill="#0b1329" stroke="#00ff88" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="362" y="17" fill="#4ade80" font-size="11" font-weight="600" class="mono">🛰️ ANDROID EDGE LINK</text>
    </g>
  </g>

  <!-- Right: Futuristic Tactical Radar HUD & Dynamic Waveform -->
  <g transform="translate(1040, 180)">
    <!-- Radar Base Circles -->
    <circle cx="0" cy="0" r="100" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.2" />
    <circle cx="0" cy="0" r="70" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="40" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="4" fill="#00f0ff" />

    <!-- Crosshairs -->
    <line x1="-110" y1="0" x2="110" y2="0" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.3" />
    <line x1="0" y1="-110" x2="0" y2="110" stroke="#00f0ff" stroke-width="0.8" stroke-opacity="0.3" />

    <!-- Rotating Radar Scanner Beam -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
      <path d="M 0 0 L 70 -70 A 100 100 0 0 1 100 0 Z" fill="url(#neonCyan)" opacity="0.15" />
      <line x1="0" y1="0" x2="100" y2="0" stroke="#00f0ff" stroke-width="1.8" opacity="0.8" filter="url(#glow)" />
    </g>

    <!-- Radar Blip / Intercepted Threat -->
    <circle cx="45" cy="-35" r="3.5" fill="#ff0055" filter="url(#glow)">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="52" y="-32" fill="#ff0055" font-size="9" font-weight="700" class="mono">SPOOF DETECTED</text>
  </g>

  <!-- Bottom: Animated Multi-Band Acoustic Waveform Spectrum -->
  <g transform="translate(242, 305)">
    <!-- 24 Audio Bars with Individual Animations -->
    <!-- Bar 1 -->
    <rect x="0" y="-12" width="4" height="24" rx="2" fill="#00f0ff" opacity="0.8">
      <animate attributeName="height" values="8;26;12;20;8" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="-4;-13;-6;-10;-4" dur="1.2s" repeatCount="indefinite" />
    </rect>
    <rect x="7" y="-18" width="4" height="36" rx="2" fill="#00f0ff" opacity="0.85">
      <animate attributeName="height" values="14;34;18;28;14" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-7;-17;-9;-14;-7" dur="0.9s" repeatCount="indefinite" />
    </rect>
    <rect x="14" y="-8" width="4" height="16" rx="2" fill="#00f0ff" opacity="0.75">
      <animate attributeName="height" values="6;22;10;18;6" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="-3;-11;-5;-9;-3" dur="1.4s" repeatCount="indefinite" />
    </rect>
    <rect x="21" y="-15" width="4" height="30" rx="2" fill="#38bdf8" opacity="0.9">
      <animate attributeName="height" values="10;32;14;24;10" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="-5;-16;-7;-12;-5" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect x="28" y="-22" width="4" height="44" rx="2" fill="#38bdf8" opacity="0.9">
      <animate attributeName="height" values="16;40;22;36;16" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-8;-20;-11;-18;-8" dur="0.8s" repeatCount="indefinite" />
    </rect>
    <rect x="35" y="-10" width="4" height="20" rx="2" fill="#818cf8" opacity="0.85">
      <animate attributeName="height" values="8;24;12;20;8" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="-4;-12;-6;-10;-4" dur="1.3s" repeatCount="indefinite" />
    </rect>
    <rect x="42" y="-16" width="4" height="32" rx="2" fill="#a855f7" opacity="0.9">
      <animate attributeName="height" values="12;30;16;28;12" dur="1.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="-6;-15;-8;-14;-6" dur="1.0s" repeatCount="indefinite" />
    </rect>
    <rect x="49" y="-25" width="4" height="50" rx="2" fill="#c084fc" opacity="0.95">
      <animate attributeName="height" values="20;46;24;38;20" dur="0.75s" repeatCount="indefinite" />
      <animate attributeName="y" values="-10;-23;-12;-19;-10" dur="0.75s" repeatCount="indefinite" />
    </rect>
    <rect x="56" y="-14" width="4" height="28" rx="2" fill="#c084fc" opacity="0.85">
      <animate attributeName="height" values="10;26;14;22;10" dur="1.25s" repeatCount="indefinite" />
      <animate attributeName="y" values="-5;-13;-7;-11;-5" dur="1.25s" repeatCount="indefinite" />
    </rect>
    <rect x="63" y="-19" width="4" height="38" rx="2" fill="#ec4899" opacity="0.9">
      <animate attributeName="height" values="14;36;18;30;14" dur="0.95s" repeatCount="indefinite" />
      <animate attributeName="y" values="-7;-18;-9;-15;-7" dur="0.95s" repeatCount="indefinite" />
    </rect>
    <rect x="70" y="-8" width="4" height="16" rx="2" fill="#ec4899" opacity="0.8">
      <animate attributeName="height" values="6;20;10;16;6" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="-3;-10;-5;-8;-3" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <rect x="77" y="-12" width="4" height="24" rx="2" fill="#00f0ff" opacity="0.8">
      <animate attributeName="height" values="8;24;12;20;8" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="-4;-12;-6;-10;-4" dur="1.1s" repeatCount="indefinite" />
    </rect>

    <!-- Spectrum label -->
    <text x="95" y="3" fill="#64748b" font-size="10" font-weight="600" class="mono">LIVE SPECTRAL DECONVOLUTION: 16.0 kHz PCM // BI-DIRECTIONAL LSTM ACTIVE</text>
  </g>

  <!-- Top Right Live Status Beacon -->
  <g transform="translate(1030, 35)">
    <circle cx="0" cy="0" r="5" fill="#00ff88" class="hud-pulse" />
    <text x="12" y="4" fill="#00ff88" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">DEFENSE ONLINE</text>
  </g>
</svg>
