# ═══════════════════════════════════════════════════════════════════════════════
# CyberGuard SOC & AI Multi-Modal Defense — Docker Compose Orchestration
# ═══════════════════════════════════════════════════════════════════════════════
# Architecture:
# - cyberguard-backend: Core Python 3.12 FastAPI / WebSocket SOC AI engine
# - tunnel (optional profile): Secure HTTPS Cloudflare Tunnel providing a public
#   TLS endpoint for your live Vercel & GitHub Pages frontends to reach your laptop.
# ═══════════════════════════════════════════════════════════════════════════════

name: cyberguard

services:
  cyberguard-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: cyberguard-backend:latest
    container_name: cyberguard-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
      - path: .env.email
        required: false
    environment:
      - PORT=3000
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/app/data/cyberguard.db
      - DATABASE_URL=${DATABASE_URL:-}
      - CYBERGUARD_ADMIN_PASSWORD=${CYBERGUARD_ADMIN_PASSWORD:-}
      - CYBERGUARD_CORS_ORIGINS=${CYBERGUARD_CORS_ORIGINS:-https://cyber-guard-backend-ashen.vercel.app,https://arthur-2407.github.io,http://localhost:3000,http://127.0.0.1:3000}
      - CYBERGUARD_CORS_REGEX=${CYBERGUARD_CORS_REGEX:-^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0|.*\.vercel\.app|.*\.pages\.dev|.*\.github\.io|.*\.trycloudflare\.com|.*\.ngrok-free\.app|.*\.loca\.lt)(:\d+)?$}
      - VIRUSTOTAL_ENABLED=${VIRUSTOTAL_ENABLED:-true}
      - URLHAUS_ENABLED=${URLHAUS_ENABLED:-true}
      - EMAIL_TEST_MODE=${EMAIL_TEST_MODE:-false}
      - SQLITE_JOURNAL_MODE=DELETE
      - CLAMAV_TIMEOUT_SEC=30
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
    volumes:
      # Persist SQLite databases, scan history, threat telemetry, and model card
      - ./data:/app/data
      # Mount application source and configuration for real-time synchronization
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./config.yaml:/app/config.yaml
      - ./scripts:/app/scripts
      # Persist ClamAV virus signature database across container restarts and rebuilds
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - cyberguard-net

  # Secure Cloudflare Tunnel service:
  # Allows your publicly deployed frontends (Vercel & GitHub Pages) to communicate
  # with your laptop backend over end-to-end encrypted HTTPS without port forwarding.
  # Start with: docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cyberguard-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      cyberguard-backend:
        condition: service_healthy
    networks:
      - cyberguard-net
    command: ["tunnel", "--url", "http://cyberguard-backend:3000"]

volumes:
  clamav-db:
    name: cyberguard_clamav_db

networks:
  cyberguard-net:
    driver: bridge
